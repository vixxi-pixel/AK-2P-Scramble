<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AK Golf Studio | Ladies Night</title>
  <style>
    :root {
      --gold: #d4af37;
      --dark-bg: #1a1a1a;
      --glass: rgba(255, 255, 255, 0.05);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--dark-bg);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header with a subtle glass effect */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(180deg, #252525 0%, var(--dark-bg) 100%);
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .header img {
      height: 70px;
      width: auto;
      margin-right: 25px;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
    }

    .title-container {
      text-align: left;
    }

    .title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--gold);
      text-transform: uppercase;
      margin: 0;
      line-height: 1;
    }

    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 6px;
      color: #888;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* Iframe Container with a slight inner glow */
    .iframe-container {
      flex-grow: 1;
      position: relative;
      background-color: #000;
    }

    .iframe-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      pointer-events: none; /* Allows clicking through to the leaderboard */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Modern scrollbar for the iframe area */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--dark-bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <header class="header">
    <img src="logo.png" alt="AK Golf Studio Logo">
    <div class="title-container">
      <h1 class="title">Ladies Night</h1>
      <div class="subtitle">Live Leaderboard</div>
    </div>
  </header>

  <main class="iframe-container">
    <iframe src="https://portal.trackmangolf.com/tournaments/TXVsdGlSb3VuZFRvdXJuYW1lbnQKZDE4NGNjYmQ3LTJkZjUtNDcyNy1iY2NmLTg1MGQxNTJlYmQ3ODpQdWJsaXNoZWQ=/leaderboard"></iframe>
  </main>

</body>
</html>
