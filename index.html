<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AK Golf Studio Leaderboard</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a; /* Matched to logo background */
      font-family: 'Segoe UI', Arial, sans-serif;
      color: white;
      overflow: hidden; /* Prevents double scrollbars */
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px 20px;
      background-color: #1a1a1a;
      border-bottom: 2px solid #d4af37; /* Gold accent line */
    }

    .header img {
      height: 60px;
      width: auto;
      margin-right: 20px;
    }

    .title {
      font-size: clamp(1.5rem, 5vw, 2.5rem); /* Responsive font size */
      font-weight: bold;
      letter-spacing: 2px;
      color: #d4af37; /* Gold tone from logo */
      text-transform: uppercase;
    }

    .iframe-container {
      width: 100%;
      height: calc(100vh - 95px); /* Adjusts for header height */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <img src="logo.png" alt="AK Golf Studio Logo">
    <div class="title">LADIES NIGHT LIVE</div>
  </div>

  <div class="iframe-container">
    <iframe src="https://portal.trackmangolf.com/tournaments/TXVsdGlSb3VuZFRvdXJuYW1lbnQKZDE4NGNjYmQ3LTJkZjUtNDcyNy1iY2NmLTg1MGQxNTJlYmQ3ODpQdWJsaXNoZWQ=/leaderboard"></iframe>
  </div>

</body>
</html>
